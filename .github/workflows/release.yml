name: Release

# Every stable-v* tag builds a drop-in resource zip and attaches it to a
# GitHub Release. The zip holds a single top-level vMenu.Enhanced/ folder (the
# name matters: plugins, config names and player KVP are keyed to it).
# The original branch releases from plain v* tags; neither pattern matches the
# other's tags.

on:
  push:
    tags: ['stable-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The suite gates the artifact, so a tag never ships broken code.
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: '5.4'

      - uses: leafo/gh-actions-luarocks@v4

      - name: Install test tooling
        run: |
          luarocks install busted
          luarocks install luacheck

      - name: Lint
        run: luacheck .

      - name: Unit tests
        run: busted --output=utfTerminal

      - name: Assemble drop-in resource folder
        run: |
          mkdir -p dist/vMenu.Enhanced
          cp fxmanifest.lua LICENSE.md dist/vMenu.Enhanced/
          for dir in shared menu client server config ui language plugin; do
            if [ -d "$dir" ]; then cp -r "$dir" dist/vMenu.Enhanced/; fi
          done

      - name: Build zip
        run: |
          cd dist
          zip -r "vMenu.Enhanced-${GITHUB_REF_NAME}.zip" vMenu.Enhanced
          echo "Contents:"
          unzip -l "vMenu.Enhanced-${GITHUB_REF_NAME}.zip" | head -30

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: lua-vmenu ${{ github.ref_name }}
          files: dist/vMenu.Enhanced-*.zip
          generate_release_notes: true
          # Pre-release until the port reaches parity with upstream (stable-v1.0.0).
          prerelease: ${{ startsWith(github.ref_name, 'stable-v0.') }}
          body: |
            **Lua port of [vMenu Enhanced](https://github.com/TomGrobbe/vMenu/tree/enhanced). Runs on FiveM Legacy and FiveM Enhanced.**

            ## Install

            1. Download `vMenu.Enhanced-${{ github.ref_name }}.zip` below.
            2. Unzip it into your server's `resources/` folder. It extracts as a single
               `vMenu.Enhanced` folder. **Keep that folder name**, the resource refuses to start under any other.
            3. Add to your server.cfg, in this order:
               ```
               add_filesystem_permission vMenu.Enhanced write vMenu.Enhanced
               ensure vMenu.Enhanced
               ```
